name: Build AndroidPocketTerm

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Build release APKs
        run: ./gradlew --no-daemon assembleRelease

      - name: Align and sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          mkdir -p out
          find app/build/outputs/apk/release -name '*.apk' | while read -r apk; do
            name="$(basename "$apk" | sed 's/-unsigned//')"
            "$BT/zipalign" -p -f 4 "$apk" "out/$name"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KEYSTORE_PASS \
              --ks-key-alias "$KEY_ALIAS" \
              "out/$name"
            "$BT/apksigner" verify "out/$name"
          done
          rm -f "$RUNNER_TEMP/release.jks"
          ls -l out

      - uses: actions/upload-artifact@v6
        with:
          name: androidpocketterm-apks
          path: out/*.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
